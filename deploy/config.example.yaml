server:
  listen: "127.0.0.1:8080"
  # public_url: "http://127.0.0.1:8080" # defaults to actual loopback listener
  trusted_network: false # isolated demo only; not needed with authentication
  tls_cert_file: ""
  tls_key_file: ""
broker:
  mode: embedded
  storage: "./data"
  replicas: 1
  sync: always # embedded fsync of every acknowledged write; a duration such as 2m relaxes it (host crash may lose that window)
  # url: "tls://nats.example:4222" # external mode
  token_file: ""
  credentials_file: "" # alternative to token_file
  ca_file: ""
registry:
  namespace: engineering
  health_interval: 30s # zero disables periodic observations
  # Optional static provisioning, applied additively at startup (see docs/DEPLOYMENT.md).
  # Agent descriptions and skills come from native A2A cards. Config file only (no env override).
  # agents:
  #   pm:
  #     url: https://pm.example.org # A2A base URL or Agent Card URL
  #     token_file: /run/secrets/agent-pm # inbound credential bound to ID "pm" (required in secure mode)
  #   architect:
  #     url: https://architect.example.org
  #     token_file: /run/secrets/agent-architect
  #     outbound_token_file: /run/secrets/architect-recipient # sent to this HTTPS origin only
  # groups:
  #   engineering: [pm, architect]
  # pools:
  #   reviewers: [architect]
delivery:
  workers: 4 # bounded outbound HTTP concurrency; one restores serial mode
  timeout: 120s # per HTTP operation, not task execution lifetime
  retry_delay: 5s
  max_attempts: 10 # pre-submission reachability attempts only
  task_poll_interval: 0s # inherit retry_delay; successful active tasks monitored indefinitely
  retention: 168h # terminal deliveries are removed this long after their last update; also the idempotency-key/messageId retry window (a key is a new operation afterwards); range 5m–3650d
  allowed_origins: [] # loopback allowed; explicit non-loopback HTTP(S) origins
  ca_file: ""
  token_files: {} # approved HTTPS origins (no endpoint paths); aliases must use the same readable token

observability:
  dashboard: true # read-only UI; trusted local use only
  dashboard_schema: "" # trusted AMIS JSON page; empty uses embedded default
  dashboard_theme: cxd # cxd, antd, ang, dark
  dashboard_refresh_interval: 2s # default schema, 1s–1m

protocols:
  mcp:
    enabled: false # opt-in; authenticated TLS required off loopback

# Secure deployment: all credentials are mounted files, never values in YAML.
# server.tls_cert_file and server.tls_key_file plus HTTPS public_url required.
security:
  operator_token_file: ""
  # Credential files for agent IDs NOT declared under registry.agents (declared agents use
  # registry.agents.<id>.token_file; an ID may be set in only one place). Each token must be
  # unique across all principals. Rotate or revoke by editing files and restarting.
  agent_token_files: {}
  #  pm: /run/secrets/agent-pm
  #  architect: /run/secrets/agent-architect
  viewer_token_file: "" # required when authenticated dashboard enabled
