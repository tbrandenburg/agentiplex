server:
  listen: "127.0.0.1:8080"
  # public_url: "http://127.0.0.1:8080" # defaults to actual loopback listener
  trusted_network: false # isolated demo only; not needed with authentication
  tls_cert_file: ""
  tls_key_file: ""
broker:
  mode: embedded
  storage: "./data"
  replicas: 1
  # url: "tls://nats.example:4222" # external mode
  token_file: ""
  credentials_file: "" # alternative to token_file
  ca_file: ""
registry:
  namespace: engineering
  health_interval: 30s # zero disables periodic observations
delivery:
  timeout: 120s # per HTTP operation, not task execution lifetime
  retry_delay: 5s
  max_attempts: 10 # pre-submission reachability attempts only
  task_poll_interval: 0s # inherit retry_delay; successful active tasks monitored indefinitely
  allowed_origins: [] # loopback allowed; explicit non-loopback HTTP(S) origins
  ca_file: ""
  token_files: {} # map approved HTTPS origins to mounted bearer credential files

observability:
  dashboard: true # read-only UI; trusted local use only
  dashboard_schema: "" # trusted AMIS JSON page; empty uses embedded default
  dashboard_theme: cxd # cxd, antd, ang, dark
  dashboard_refresh_interval: 2s # default schema, 1s–1m

protocols:
  mcp:
    enabled: false # opt-in; authenticated TLS required off loopback

# Secure deployment: all credentials are mounted files, never values in YAML.
# server.tls_cert_file and server.tls_key_file plus HTTPS public_url required.
security:
  operator_token_file: ""
  collaborator_token_file: ""
  viewer_token_file: "" # required when authenticated dashboard enabled
