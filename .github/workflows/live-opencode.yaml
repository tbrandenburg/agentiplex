name: Live example
on:
  push:
    branches: [main]
    paths: &paths
      - 'examples/autonomous-team/**'
      - 'examples/repository-team/**'
      - 'internal/adapters/**'
      - 'internal/api/**'
      - 'internal/daemon/**'
      - 'internal/nats/**'
      - '*.go'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/live-opencode.yaml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-opencode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hybrid-free-model:
    env:
      # CI pins the free model; the launchers otherwise use the OpenCode default.
      CI_MODEL: opencode/big-pickle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install pinned OpenCode and A2A gateway
        run: |
          npm install --global @opencode/cli@2.3.2 @tbrandenburg/opencode-a2a-lite@0.9.0
          opencode --version
          opencode-a2a-lite --version
          test "$(bun --version)" = "1.4.4"
      - name: Shared repository provisioning (no model inference)
        shell: bash
        run: |
          work=$(mktemp -d)
          home=$(mktemp -d)
          trap 'rm -rf "$work" "$home"' EXIT
          git -C "$work" init -q
          git -C "$work" config user.name "Repository example CI"
          git -C "$work" config user.email "ci@example.invalid"
          printf 'Synthetic repository\n' > "$work/README.md"
          cat > "$work/opencode.json" <<EOF
          {
            "model": {"providerID": "${CI_MODEL%%/*}", "model": "${CI_MODEL#*/}"},
            "mcp": {"servers": {"agentiplex": {"type": "remote", "url": "http://127.0.0.1:19180/mcp", "protocol": "auto", "codemode": false}}}
          }
          EOF
          git -C "$work" add README.md opencode.json
          git -C "$work" commit -qm "synthetic fixture"
          env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 USER="$(id -un)" \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            make repository-team WORKSPACE="$work" REPOSITORY_ARGS="--check --accept-full-access --headless --seconds 180 --port 19180"
          test -z "$(git -C "$work" status --porcelain)"
          # Keep the fixed workspace check off the hybrid test's 19080-19086 ports.
          # A second startup uses a clean independent clone/worktree and a kernel-selected port.
          git -C "$work" rm opencode.json
          git -C "$work" commit -qm 'remove local config for clone mode'
          env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 USER="$(id -un)" \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            make repository-team REPO="$work" MODEL="$CI_MODEL" REPOSITORY_ARGS="--check --accept-full-access --headless --seconds 180"
          test -z "$(git -C "$work" status --porcelain)"
      - name: Credential-free live hybrid acceptance
        shell: bash
        run: |
          # No credential forwarding; isolate the launcher from ambient keys
          # and OpenCode home/config. Only the synthetic fixture is reviewed.
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 USER="$(id -un)" \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            make live-check MODEL="$CI_MODEL"
