name: Checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Release bump and safety guards
        run: bash scripts/test-release.sh
      - name: Resolve pinned dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format and resolve source manifest
        run: |
          make fmt
          tar -czf /tmp/agentiplex-formatted.tar.gz $(git ls-files '*.go') go.mod go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, race-enabled unit and integration tests, and vet
        run: make build test lint GO_TEST_FLAGS="-race -count=1 -v"
      - name: Simulated engineering team and dashboard
        run: |
          bash -n examples/engineering-team/demo.sh
          node --check internal/dashboard/static/bootstrap.js
          node --check examples/engineering-team/browser-check.mjs
          make demo-check DEMO_ARGS=--browser-check
      - name: Autonomous team configuration and provider-free startup
        run: make autonomous-check
      - name: Save resolved dependency manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-module-lock
          path: |
            go.mod
            go.sum
      - name: Save formatted source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: /tmp/agentiplex-formatted.tar.gz
      - name: Build image
        run: make docker IMAGE=agentiplex:ci
      - name: Container smoke test
        run: |
          docker run -d --name agentiplex-ci -p 127.0.0.1:18080:8080 agentiplex:ci --listen 0.0.0.0:8080 --trusted-network --public-url http://127.0.0.1:18080 --storage /data
          trap 'docker logs agentiplex-ci; docker rm -f agentiplex-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz; then
              curl -fsS http://127.0.0.1:18080/.well-known/agent-card.json | jq -e '.name == "Agentiplex" and .supportedInterfaces[0].url == "http://127.0.0.1:18080/a2a"'
              curl -fsS http://127.0.0.1:18080/ui/ | grep -q 'Agent collaboration console'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Secure Compose deployment and recovery
        run: |
          bash -n scripts/demo-secrets.sh scripts/compose-check.sh scripts/helm-check.sh scripts/package-release.sh
          bash scripts/compose-check.sh
      - name: Helm deployment on kind
        run: |
          kind version
          helm version
          bash scripts/helm-check.sh
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run native and Helm release packaging
        run: |
          helm lint charts/agentiplex
          bash scripts/package-release.sh v0.0.0-ci
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
  multiarch-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Dry-run multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/agentiplex-multiarch.tar
          sbom: true
          provenance: mode=max
      - name: Verify OCI archive
        run: |
          test -s /tmp/agentiplex-multiarch.tar
          tar -xOf /tmp/agentiplex-multiarch.tar index.json | jq -e '.manifests|length>0'
