name: 'Examples / Live / Three-agent quickstart'
on:
  push:
    branches: [main]
    paths: &paths
      - 'README.md'
      - 'examples/discussion-team/**'
      - 'tests/examples/**'
      - 'core/**'
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/discussion-quickstart.yaml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discussion-quickstart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  readme-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: README setup (build and install)
        run: |
          make build
          npm install --global @opencode/cli@2.4.1 @tbrandenburg/opencode-a2a-lite@0.9.3
          test "$(opencode --version)" = 'opencode v2.4.1'
          test "$(opencode-a2a-lite --version)" = '0.9.3'
          test "$(bun --version)" = '1.4.4'
      - name: Execute ordinary, until-done and actor-owned README commands with three real read-only agents
        shell: bash
        run: |
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 USER="$(id -un)" \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -count=1 -v -timeout 50m ./tests/examples -run '^TestLiveTeam$' -args -live discussion
